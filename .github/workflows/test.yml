name: Test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=24.22.1 <25'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check package exports types
        run: npm run typecheck:exports

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify no generated files changed
        run: git diff --exit-code
