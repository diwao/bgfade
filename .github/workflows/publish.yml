name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=24.22.1 <25'
          check-latest: true
          registry-url: https://registry.npmjs.org

      - name: Audit dependencies before publishing
        run: npm audit --package-lock-only --include=dev --audit-level=low

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check package exports types
        run: npm run typecheck:exports

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify generated files
        run: git diff --exit-code -- dist

      - name: Publish to npm
        run: npm publish
